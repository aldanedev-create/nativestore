name: Native Windows wheel
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/nativestore/desktop/**'
      - 'crates/**'
      - 'scripts/stage_native.py'
      - '.github/workflows/native-wheels.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python -m pip install -e ".[dev,packaging,flask,fastapi]" twine
      - run: cargo build -p nativestore-cli --release --locked
      - run: cargo build --manifest-path src/nativestore/desktop/Cargo.toml --release --locked
      - run: python -m nativestore new runtime-check
      - run: python scripts/smoke_desktop.py src/nativestore/desktop/target/release/nativestore-desktop.exe --project runtime-check
      - run: python scripts/stage_native.py --desktop src/nativestore/desktop/target/release/nativestore-desktop.exe --tools target/release/nativestore-cli.exe
      - run: python -m build --wheel
      - run: python scripts/verify_distribution.py
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: nativestore-windows-wheel
          path: dist/*.whl

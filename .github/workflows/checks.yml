name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,flask,fastapi]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src/nativestore --exclude scaffold
      - run: python -m build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p nativestore-cli --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,flask,fastapi]"
      - run: python -m pytest -q tests/test_rust_parity.py
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python -m pip install -e ".[dev,packaging]"
      - run: cargo install tauri-cli --version "^2" --locked
      - run: python -m nativestore new expense-desk
      - run: python -m nativestore test
        working-directory: expense-desk
      - run: python -m nativestore build
        working-directory: expense-desk
      - uses: actions/upload-artifact@v4
        with:
          name: expense-desk-windows
          if-no-files-found: error
          path: expense-desk/.nativestore/builds/**/desktop/target/release/bundle/nsis/*.exe
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m pip install -e . pip-audit
      - run: python -m pip_audit
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file src/nativestore/desktop/Cargo.lock
